<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paddle Checkout</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    :root { color-scheme: light; --bg:#ffffff; --soft:#f6f7fb; --line:#e5e7eb; --text:#0f172a; --muted:#64748b; --err:#b91c1c; --accent:#4338ca; --ok:#15803d; }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: var(--text); font-size: 14px; }
    .page { max-width: 980px; margin: 0 auto; padding: 20px 16px 8px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    .secure { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--muted); }
    .secure svg { width: 14px; height: 14px; }
    .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #fef3c7; color: #b45309; }
    .layout { display: grid; gap: 24px; }
    @media (min-width: 760px) { .layout.has-summary { grid-template-columns: minmax(240px, 340px) 1fr; align-items: start; } }
    .summary { background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .summary h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
    .total-big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0 0 4px; }
    .recurring { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .line.item { border-top: 0; padding-top: 0; }
    .line .name { color: var(--text); }
    .line.muted { color: var(--muted); }
    .line.total { font-weight: 700; }
    .mor { margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    #status { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 16px; text-align: center; color: var(--muted); }
    #status[hidden] { display: none; }
    #status.error { color: var(--err); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    #status.error .spinner { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { color: var(--muted); font-size: 12px; max-width: 420px; }
    .checkout-container { min-height: 0; }
    .checkout-container.open { min-height: 450px; }
    .actions { display: flex; gap: 12px; justify-content: center; }
    button { font: inherit; font-size: 13px; cursor: pointer; }
    #retry { display: none; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    #cancel { display: none; margin: 8px auto 16px; background: none; border: 0; color: var(--muted); text-decoration: underline; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<div class="page">
  <div class="top">
    <span class="secure"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure checkout</span>
    <span id="testPill" class="pill" hidden>Test mode</span>
  </div>
  <div class="layout" id="layout">
    <aside class="summary" id="summary" hidden>
      <h2>Order summary</h2>
      <div class="total-big" id="sumTotal"></div>
      <div class="recurring" id="sumRecurring" hidden></div>
      <div id="sumLines"></div>
      <div class="mor">Payment is processed by Paddle.com, the Merchant of Record for this order. Sales tax or VAT is calculated from your location.</div>
    </aside>
    <main>
      <div id="status"><div class="spinner"></div><div id="statusText">Loading secure checkout…</div><div id="hint" class="hint"></div>
        <div class="actions"><button id="retry" type="button">Try again</button></div></div>
      <div class="checkout-container"></div>
      <button id="cancel" type="button">Cancel</button>
    </main>
  </div>
</div>

<script>
  // Talks to the HighLevel checkout that embeds this page (see GHL Custom Payment Provider docs).
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const hintEl = document.getElementById('hint');
  const retryBtn = document.getElementById('retry');
  const cancelBtn = document.getElementById('cancel');
  const container = document.querySelector('.checkout-container');

  const PROPS_TIMEOUT_MS = 15000;
  const LOAD_TIMEOUT_MS = 25000;

  let props = null;          // last payment_initiate_props from HighLevel
  let busy = false;          // a session request / checkout open is in flight
  let paddleToken = null;    // Paddle.js can only be initialized once per page
  let session = null;
  let loadTimer = null;

  function toParent(msg) {
    window.parent.postMessage(JSON.stringify(msg), '*');
  }
  function setStatus(text, { error = false, hint = '', retry = false } = {}) {
    statusEl.hidden = !text;
    statusEl.className = error ? 'error' : '';
    statusText.textContent = text;
    hintEl.textContent = hint;
    retryBtn.style.display = retry ? 'inline-block' : 'none';
  }
  function fail(description, hint) {
    busy = false;
    clearTimeout(loadTimer);
    setStatus(description, { error: true, hint, retry: !!props });
    toParent({ type: 'custom_element_error_response', error: { description } });
  }

  cancelBtn.addEventListener('click', () => toParent({ type: 'custom_element_close_response' }));
  retryBtn.addEventListener('click', () => props && start(props));

  // Sends Paddle's raw error event to the server log so failures can be diagnosed.
  function report(e) {
    try {
      fetch('/api/checkout/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transactionId: session && session.transactionId, event: e }),
      }).catch(() => {});
    } catch {}
  }
  function hintFor(code, detail) {
    const text = `${code || ''} ${detail || ''}`.toLowerCase();
    if (/domain|approv|origin|forbidden|default.*(link|url)|checkout.*(url|link)/.test(text)) {
      return 'In Paddle, approve the checkout website (Checkout → Website approval) and set a default payment link on that domain (Checkout → Checkout settings).';
    }
    return '';
  }

  // ---- order summary (from the session first, then Paddle's live totals incl. tax) ----
  const PERIOD = { day: 'day', week: 'week', month: 'month', year: 'year' };
  function money(amount, currency) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(Number(amount)); }
    catch { return `${Number(amount).toFixed(2)} ${currency}`; }
  }
  function every(cycle) {
    if (!cycle || !PERIOD[cycle.interval]) return '';
    const n = Number(cycle.frequency || 1);
    return n === 1 ? `per ${PERIOD[cycle.interval]}` : `every ${n} ${PERIOD[cycle.interval]}s`;
  }
  function line(name, value, cls) {
    const row = document.createElement('div');
    row.className = 'line ' + (cls || '');
    const a = document.createElement('span'); a.className = 'name'; a.textContent = name;
    const b = document.createElement('span'); b.textContent = value;
    row.append(a, b);
    return row;
  }
  function renderSummary({ items, subtotal, tax, discount, total, currency, recurringTotal, cycle }) {
    document.getElementById('summary').hidden = false;
    document.getElementById('layout').classList.add('has-summary');
    document.getElementById('sumTotal').textContent = money(total, currency);
    const rec = document.getElementById('sumRecurring');
    rec.hidden = !cycle;
    if (cycle) rec.textContent = `then ${money(recurringTotal ?? total, currency)} ${every(cycle)}`;
    const lines = document.getElementById('sumLines');
    lines.replaceChildren(
      ...items.map((it, i) => line(it.quantity > 1 ? `${it.name} × ${it.quantity}` : it.name, money(it.amount, currency), i === 0 ? 'item' : '')),
      ...(subtotal != null && (tax || discount) ? [line('Subtotal', money(subtotal, currency), 'muted')] : []),
      ...(discount ? [line('Discount', '−' + money(discount, currency), 'muted')] : []),
      ...(tax != null ? [line('Tax', money(tax, currency), 'muted')] : []),
      line('Total due today', money(total, currency), 'total'),
    );
  }
  function summaryFromSession(s) {
    if (!s || s.amount == null) return;
    renderSummary({ items: [{ name: s.productName || 'Payment', quantity: 1, amount: s.amount }], total: s.amount, currency: s.currency,
      cycle: s.billingCycle, recurringTotal: s.amount });
  }
  function summaryFromPaddle(d) {
    if (!d || !d.totals || !d.currency_code) return;
    const items = (d.items || []).map((it) => ({
      name: it.price_name || (it.product && it.product.name) || 'Item',
      quantity: it.quantity || 1,
      amount: it.totals ? it.totals.subtotal : 0,
    }));
    const cycle = (d.items || []).map((it) => it.billing_cycle).find(Boolean);
    renderSummary({ items, subtotal: d.totals.subtotal, tax: d.totals.tax, discount: d.totals.discount, total: d.totals.total,
      currency: d.currency_code, cycle, recurringTotal: d.recurring_totals ? d.recurring_totals.total : undefined });
  }

  function onPaddleEvent(e) {
    if (e.data && e.data.totals) summaryFromPaddle(e.data);
    if (e.name === 'checkout.loaded') {
      clearTimeout(loadTimer);
      busy = false;
      setStatus('');
      if (!standalone) cancelBtn.style.display = 'block';
    }
    if (e.name === 'checkout.completed') {
      setStatus(standalone ? 'Payment complete. Thank you! You can close this page.' : 'Payment received. Finishing up…');
      container.classList.remove('open');
      toParent({ type: 'custom_element_success_response', chargeId: (e.data && e.data.transaction_id) || session.transactionId });
    }
    if (e.name === 'checkout.error' || e.name === 'checkout.payment.failed') {
      report(e);
      const err = e.error || (e.data && e.data.error) || e;
      const detail = err.detail || err.message || 'Payment failed. Please try again.';
      fail(err.code ? `${detail} (${err.code})` : detail, hintFor(err.code, detail));
    }
    if (e.name === 'checkout.closed') toParent({ type: 'custom_element_close_response' });
  }

  // Initializes Paddle.js (once per page) and opens the inline checkout for `session`.
  function openCheckout() {
    document.getElementById('testPill').hidden = session.environment !== 'sandbox';
    summaryFromSession(session);
    if (!window.Paddle) throw new Error('Paddle.js could not be loaded. Check your connection or ad blocker.');
    if (!paddleToken) {
      if (session.environment === 'sandbox') Paddle.Environment.set('sandbox');
      Paddle.Initialize({ token: session.token, eventCallback: onPaddleEvent });
      paddleToken = session.token;
    }

    setStatus('Opening Paddle checkout…');
    container.classList.add('open');
    loadTimer = setTimeout(() => fail(
      'Paddle checkout did not load.',
      'In Paddle, set a default payment link on an approved domain (Checkout → Checkout settings) and make sure the website is approved.',
    ), LOAD_TIMEOUT_MS);

    Paddle.Checkout.open({
      transactionId: session.transactionId,
      customer: session.email ? { email: session.email } : undefined,
      settings: {
        displayMode: 'inline',
        variant: 'one-page',
        frameTarget: 'checkout-container',
        frameInitialHeight: 450,
        frameStyle: 'width:100%; min-width:312px; background-color:transparent; border:none;',
        showAddDiscounts: false,
        allowLogout: false,
      },
    });
  }

  async function start(data) {
    if (busy) return;
    busy = true;
    cancelBtn.style.display = 'none';
    container.classList.remove('open');
    setStatus('Preparing secure checkout…');
    try {
      const res = await fetch('/api/checkout/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || 'Could not start checkout.');
      session = json;

      openCheckout();
    } catch (err) {
      container.classList.remove('open');
      fail(err.message);
    }
  }

  window.addEventListener('message', (event) => {
    let data = event.data;
    if (typeof data === 'string') {
      try { data = JSON.parse(data); } catch { return; }
    }
    if (!data || typeof data !== 'object') return;

    if (data.type === 'setup_initiate_props') {
      fail('Saving a card without a payment is not supported by Paddle.');
      return;
    }
    if (data.type !== 'payment_initiate_props') return;
    props = data;
    start(data);
  });

  // Opened from a Paddle payment link (?_ptxn=…), e.g. an invoice email: no HighLevel parent.
  const linkTxn = new URLSearchParams(location.search).get('_ptxn');
  const standalone = !!linkTxn || window.parent === window;
  if (linkTxn) {
    // Paddle.js would auto-open its own overlay for _ptxn; drop it and open inline instead.
    history.replaceState(null, '', location.pathname);
    (async () => {
      setStatus('Preparing secure checkout…');
      try {
        const res = await fetch('/api/checkout/link?txn=' + encodeURIComponent(linkTxn));
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || 'This payment link is not valid.');
        session = json;
        openCheckout();
      } catch (err) {
        container.classList.remove('open');
        fail(err.message);
      }
    })();
  }

  // Tell HighLevel we're ready for payment_initiate_props. Its listener can attach after this
  // frame loads, so repeat the signal until the props arrive.
  const ready = () => toParent({ type: 'custom_provider_ready', loaded: true, addCardOnFileSupported: false });
  if (!linkTxn) ready();
  let readyTries = 0;
  const readyTimer = setInterval(() => {
    if (props || linkTxn || ++readyTries > 10) return clearInterval(readyTimer);
    ready();
  }, 1500);
  setTimeout(() => {
    if (!props && !linkTxn) setStatus('Waiting for payment details from the checkout page…', {
      error: true,
      hint: 'Reload the page. If this keeps happening, make sure Paddle is set as the default payment provider in Payments → Integrations.',
    });
  }, PROPS_TIMEOUT_MS);
</script>
</body>
</html>
